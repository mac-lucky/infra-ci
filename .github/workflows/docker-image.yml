name: Docker Image for infra-ci

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The ceiling for every job in the reusable. Its jobs request exactly
    # these, and a run asking for more than the caller grants never starts.
    permissions:
      contents: write         # cut the GitHub Release on a v* tag
      packages: write         # push the image to GHCR
      security-events: write  # upload the Grype SARIF
      actions: read           # upload-sarif reads the run it reports on
    uses: mac-lucky/actions-shared-workflows/.github/workflows/docker-cicd-reusable.yml@master
    with:
      app_name: "infra-ci"
      ghcr_image: "ghcr.io/mac-lucky/infra-ci"
      enable_security_scan: true
      scan_severity_cutoff: "high"
      scan_only_fixed: true
      scan_fail_build: true
      # Every tool is checked by the self-check RUN at the end of the
      # Dockerfile, so a broken one already fails the build. This only proves
      # the built image starts and runs a command.
      smoke_test_script: >-
        docker run --rm "$SMOKE_IMAGE" tofu version
