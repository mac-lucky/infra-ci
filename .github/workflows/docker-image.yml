name: Docker Image for infra-ci

on:
  schedule:
    - cron: '0 4 * * 1'
  push:
    branches: [ "master" ]
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: mac-lucky/actions-shared-workflows/.github/workflows/docker-cicd-reusable.yml@master
    with:
      app_name: "infra-ci"
      ghcr_image: "ghcr.io/mac-lucky/infra-ci"
      # No upstream project to track. The point of the weekly rebuild is to pull
      # fresh base layers and package updates, so there is no version to compare.
      enable_version_check: false
      enable_schedule_build: true
      enable_security_scan: true
      scan_severity_cutoff: "high"
      scan_only_fixed: true
      scan_fail_build: true
      platforms: "linux/amd64,linux/arm64"
