name: Docker Image for infra-ci

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: mac-lucky/actions-shared-workflows/.github/workflows/docker-cicd-reusable.yml@master
    with:
      app_name: "infra-ci"
      ghcr_image: "ghcr.io/mac-lucky/infra-ci"
      enable_security_scan: true
      scan_severity_cutoff: "high"
      scan_only_fixed: true
      scan_fail_build: true
      smoke_test_script: >-
        docker run --rm "$SMOKE_IMAGE" sh -c 'tofu version && sops --version && bun --version && op --version && node --version && python3 -c "import jinja2" && age --version'
